name: BC AL EXTENSION CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Download AL Symbols
        shell: powershell
        run: |
          write-host "Symbols assumed present in .alpackages/"

      - name: Compile AL Extension
        shell: powershell
        run: |
          # find alc.exe dynamically
          $alcPath = (Get-ChildItem "C:\Users\user\.vscode\extensions\ms-dynamics-smb.al-*\bin\win32\alc.exe" | Sort-Object LastWriteTime -Descending | select-object -first 1).FullName
          if (-not $alcPath) {
            Write-Error "alc.exe not found. Ensure AL Language extension is installed in VS Code."
            exit 1
          }

          Write-host "Using alc.exe at: $alcPath"
          # create output directory if it doesn't exist
          New-Item -ItemType directory -Force -Path "${{ github.workspace }}\output" | Out-Null

          # compile the app
          & $alcPath /project:"${{ github.workspace }}" /packagecachepath:"${{ github.workspace }}\.alpackages" /out:"${{ github.workspace }}\output\ALProject1.app"

          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "Compilation successful"

      - name: Run AL Tests
        shell: powershell
        run: |
          $testApp = "${{ github.workspace }}\output\ALProject1.test.app"
          if (Test-Path $testApp) {
            Write-Host "running tests..."
          } else {
            Write-Host "No test app found, skipping tests"
          }

      - name: Publish to Cronus BC
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          BC_SERVER_INSTANCE: ${{ secrets.BC_SERVER_INSTANCES }}
          BC_TENANT: ${{ secrets.BC_TENANT }}
          BC_USERNAME: ${{ secrets.BC_USERNAME }}
          BC_PASSWORD: ${{ secrets.BC_PASSWORD }}
        run: |
          $navTool = (Get-ChildItem -Path "C:\Program Files\Microsoft Dynamics 365 Business Central" -Recurse -Filter "NavAdminTool.ps1" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $navTool) {
            Write-Error "NavAdminTool.ps1 not found. Check your BC installation."
            exit 1
          }
          Write-Host "Using NavAdminTool at: $navTool"
          Import-Module $navTool

          $appFile = "${{ github.workspace }}\output\ALProject1.app"

          # Safe Upgrade Sequence: Uninstall -> Unpublish -> Publish -> Sync -> Install
          try {
              Write-Host "Attempting to uninstall and unpublish old version..."
              Uninstall-NAVApp -ServerInstance $env:BC_SERVER_INSTANCE -Name "ALProject1" -Tenant $env:BC_TENANT -ErrorAction SilentlyContinue
              Unpublish-NAVApp -ServerInstance $env:BC_SERVER_INSTANCE -Name "ALProject1" -Tenant $env:BC_TENANT -ErrorAction SilentlyContinue
          } catch { 
              Write-Host "No previous version to clean up." 
          }
          
          Write-Host "Publishing new app version..."
          Publish-NAVApp -ServerInstance $env:BC_SERVER_INSTANCE -Path $appFile -SkipVerification
          
          Write-Host "Syncing app..."
          Sync-NAVApp -ServerInstance $env:BC_SERVER_INSTANCE -Name "ALProject1" -Tenant $env:BC_TENANT
          
          Write-Host "Installing app..."
          Install-NAVApp -ServerInstance $env:BC_SERVER_INSTANCE -Name "ALProject1" -Tenant $env:BC_TENANT
          
          Write-Host "Extension successfully deployed to Cronus!"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: bc-extension-app
          path: output/*.app 

 